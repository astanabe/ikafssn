name: Release

run-name: "ikafssn v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 0.1.2026.03.18)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu-22.04
            os: ubuntu-22.04
            ubuntu_ver: "22.04"
            pkg_type: deb
          - target: aarch64-linux-gnu-22.04
            os: ubuntu-22.04-arm
            ubuntu_ver: "22.04"
            pkg_type: deb
          - target: x86_64-linux-gnu-24.04
            os: ubuntu-24.04
            ubuntu_ver: "24.04"
            pkg_type: deb
          - target: aarch64-linux-gnu-24.04
            os: ubuntu-24.04-arm
            ubuntu_ver: "24.04"
            pkg_type: deb
          - target: aarch64-apple-darwin-tahoe
            os: macos-26
            ubuntu_ver: ""
            pkg_type: bottle
            bottle_tag: arm64_tahoe
          - target: x86_64-linux-el9
            os: ubuntu-24.04
            container: almalinux:9
            ubuntu_ver: ""
            pkg_type: rpm
            el_ver: "9"
          - target: x86_64-linux-el10
            os: ubuntu-24.04
            container: almalinux:10
            ubuntu_ver: ""
            pkg_type: rpm
            el_ver: "10"
          - target: aarch64-linux-el9
            os: ubuntu-24.04-arm
            container: almalinux:9
            ubuntu_ver: ""
            pkg_type: rpm
            el_ver: "9"
          - target: aarch64-linux-el10
            os: ubuntu-24.04-arm
            container: almalinux:10
            ubuntu_ver: ""
            pkg_type: rpm
            el_ver: "10"
          - target: x86_64-linux-conda
            os: ubuntu-24.04
            ubuntu_ver: ""
            pkg_type: conda
            conda_subdir: linux-64
          - target: aarch64-linux-conda
            os: ubuntu-24.04-arm
            ubuntu_ver: ""
            pkg_type: conda
            conda_subdir: linux-aarch64
          - target: aarch64-apple-darwin-conda
            os: macos-26
            ubuntu_ver: ""
            pkg_type: conda
            conda_subdir: osx-arm64

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}

    steps:
      - name: Install git (container)
        if: matrix.container
        run: dnf install -y git

      - uses: actions/checkout@v6

      # ---- System dependencies ----

      - name: Install system dependencies (Linux 24.04)
        if: runner.os == 'Linux' && matrix.ubuntu_ver == '24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake dpkg-dev \
            libtbb-dev liblmdb-dev libsqlite3-dev \
            libcurl4-openssl-dev libjsoncpp-dev \
            zlib1g-dev libbz2-dev liblzma-dev libdeflate-dev autoconf \
            libssl-dev uuid-dev

      - name: Install system dependencies (Linux 22.04)
        if: runner.os == 'Linux' && matrix.ubuntu_ver == '22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake dpkg-dev \
            gcc-12 g++-12 \
            libtbb-dev liblmdb-dev libsqlite3-dev \
            libcurl4-openssl-dev libjsoncpp-dev \
            zlib1g-dev libbz2-dev liblzma-dev libdeflate-dev autoconf \
            libssl-dev uuid-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS' && matrix.pkg_type != 'conda'
        run: |
          pkgs=(tbb lmdb sqlite3 curl jsoncpp xz libdeflate autoconf automake libtool openssl@3)
          to_install=()
          for p in "${pkgs[@]}"; do
            brew list --formula "$p" >/dev/null 2>&1 || to_install+=("$p")
          done
          if [ ${#to_install[@]} -gt 0 ]; then
            brew install "${to_install[@]}"
          else
            echo "All required formulae already installed."
          fi

      - name: Install system dependencies (EL)
        if: matrix.pkg_type == 'rpm'
        run: |
          dnf install -y epel-release
          dnf install -y 'dnf-command(config-manager)' || true
          dnf config-manager --set-enabled crb || true
          dnf install -y \
            gcc-c++ cmake rpm-build make \
            tbb-devel lmdb-devel sqlite-devel \
            libcurl-devel jsoncpp-devel \
            zlib-devel bzip2-devel xz-devel libdeflate-devel \
            openssl-devel libuuid-devel \
            autoconf automake libtool \
            tar gzip bzip2 zstd patch diffutils findutils which
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh

      - name: Install GCC 12 toolset (EL 9)
        if: matrix.el_ver == '9'
        run: dnf install -y gcc-toolset-12-gcc-c++

      # ---- Environment ----

      - name: Set environment
        run: |
          echo "NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          version=$(grep 'set(IKAFSSN_VERSION' CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          echo "IKAFSSN_VERSION=${version}" >> "$GITHUB_ENV"

      # ---- Skip if the asset for this target already exists in the release ----

      - name: Compute expected release asset filename
        id: expected
        shell: bash
        run: |
          case "${{ matrix.pkg_type }}" in
            deb)
              case "${{ runner.arch }}" in
                X64)   arch="amd64" ;;
                ARM64) arch="arm64" ;;
                *)     arch="${{ runner.arch }}" ;;
              esac
              filename="ikafssn_${IKAFSSN_VERSION}_ubuntu-${{ matrix.ubuntu_ver }}_${arch}.deb"
              ;;
            rpm)
              case "${{ runner.arch }}" in
                X64)   arch="x86_64" ;;
                ARM64) arch="aarch64" ;;
                *)     arch="${{ runner.arch }}" ;;
              esac
              filename="ikafssn-${IKAFSSN_VERSION}.el${{ matrix.el_ver }}.${arch}.rpm"
              ;;
            bottle)
              filename="ikafssn-${IKAFSSN_VERSION}.${{ matrix.bottle_tag }}.bottle.tar.gz"
              ;;
            conda)
              filename="ikafssn_${IKAFSSN_VERSION}_${{ matrix.conda_subdir }}.conda"
              ;;
            *)
              echo "::error::unknown pkg_type ${{ matrix.pkg_type }}"
              exit 1
              ;;
          esac
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"
          echo "::notice::Expected release asset: ${filename}"

      - name: Check if release asset already exists
        id: check_asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${IKAFSSN_VERSION}"
          expected="${{ steps.expected.outputs.filename }}"
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${tag} does not exist yet; will build."
            exit 0
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
                --json assets --jq '.assets[].name' \
              | grep -Fxq "${expected}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Asset ${expected} already attached to ${tag}; skipping build. Delete it from the release to force a rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Asset ${expected} not yet attached to ${tag}; will build."
          fi

      - name: Use GCC 12 (Ubuntu 22.04)
        if: steps.check_asset.outputs.exists != 'true' && matrix.ubuntu_ver == '22.04'
        run: |
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - name: Use GCC 12 (EL 9)
        if: steps.check_asset.outputs.exists != 'true' && matrix.el_ver == '9'
        run: |
          echo "CC=/opt/rh/gcc-toolset-12/root/usr/bin/gcc" >> "$GITHUB_ENV"
          echo "CXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++" >> "$GITHUB_ENV"
          echo "/opt/rh/gcc-toolset-12/root/usr/bin" >> "$GITHUB_PATH"

      - name: Set Homebrew paths (macOS)
        if: steps.check_asset.outputs.exists != 'true' && runner.os == 'macOS' && matrix.pkg_type != 'conda'
        run: |
          HB=$(brew --prefix)
          echo "HOMEBREW_PREFIX=${HB}" >> "$GITHUB_ENV"
          {
            echo "CMAKE_PREFIX_PATH=${HB}:${HB}/opt/openssl@3:${HB}/opt/sqlite3:${HB}/opt/curl"
            echo "PKG_CONFIG_PATH=${HB}/opt/openssl@3/lib/pkgconfig:${HB}/opt/sqlite3/lib/pkgconfig:${HB}/opt/curl/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      # ---- Cache source-built dependencies ----

      - name: Cache source-built dependencies
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda'
        uses: actions/cache@v5
        id: deps-cache
        with:
          path: |
            parasail
            htslib
            ncbi-cxx-toolkit
            drogon
          key: deps-${{ matrix.target }}-ncbi30.2.0-parasail2.6.2+degmatch-htslib1.23.1-drogon1.9.12+trantor1.5.26-v1

      # ---- Build Parasail ----

      - name: Build Parasail
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda' && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o parasail-2.6.2.tar.gz \
            https://github.com/jeffdaily/parasail/archive/refs/tags/v2.6.2.tar.gz
          tar xf parasail-2.6.2.tar.gz
          cd parasail-2.6.2
          patch -p1 < "${GITHUB_WORKSPACE}/patches/parasail-degmatch-cigar-score.patch"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/parasail" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          make -j"${NPROC}" parasail
          mkdir -p "${GITHUB_WORKSPACE}/parasail"/{lib,include}
          cp libparasail.a "${GITHUB_WORKSPACE}/parasail/lib/"
          cp -r ../parasail.h ../parasail "${GITHUB_WORKSPACE}/parasail/include/"

      # ---- Build htslib ----

      - name: Build htslib
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda' && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o htslib-1.23.1.tar.bz2 \
            https://github.com/samtools/htslib/releases/download/1.23.1/htslib-1.23.1.tar.bz2
          tar xf htslib-1.23.1.tar.bz2
          cd htslib-1.23.1
          autoreconf -i
          configure_args=(--prefix="${GITHUB_WORKSPACE}/htslib"
            --disable-libcurl --disable-gcs --disable-s3)
          if [ "$(uname)" = "Darwin" ]; then
            configure_args+=(
              CPPFLAGS="-I${HOMEBREW_PREFIX}/include"
              LDFLAGS="-L${HOMEBREW_PREFIX}/lib")
          fi
          ./configure "${configure_args[@]}"
          make -j"${NPROC}"
          make install

      # ---- Build NCBI C++ Toolkit ----

      - name: Build NCBI C++ Toolkit
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda' && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o ncbi-cxx-toolkit-public-release-30.2.0.tar.gz \
            https://github.com/ncbi/ncbi-cxx-toolkit-public/archive/refs/tags/release/30.2.0.tar.gz
          tar xf ncbi-cxx-toolkit-public-release-30.2.0.tar.gz
          cd ncbi-cxx-toolkit-public-release-30.2.0
          patch -p1 < "${GITHUB_WORKSPACE}/patches/ncbi-cxx-toolkit-seqdb-madvise-random.patch"
          if [ "$(uname)" = "Darwin" ]; then
            export CFLAGS="-I${HOMEBREW_PREFIX}/include"
            export CXXFLAGS="-I${HOMEBREW_PREFIX}/include -std=c++20"
          else
            export CXXFLAGS="-std=c++20"
          fi
          ./cmake-configure \
            --without-debug \
            --with-projects="objtools/blast/seqdb_reader;objtools/blast/blastdb_format" \
            --with-install="${GITHUB_WORKSPACE}/ncbi-cxx-toolkit"
          cd CMake-*/build
          make -j"${NPROC}"
          make install

      # ---- Detect NCBI build tag ----

      - name: Detect NCBI build tag
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda'
        id: ncbi
        run: |
          build_tag=$(basename ncbi-cxx-toolkit/CMake-*/)
          echo "build_tag=${build_tag}" >> "$GITHUB_OUTPUT"

      # ---- Build Drogon (static, with trantor submodule fetched separately) ----

      - name: Build Drogon
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda' && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o drogon-1.9.12.tar.gz \
            https://github.com/drogonframework/drogon/archive/refs/tags/v1.9.12.tar.gz
          tar xf drogon-1.9.12.tar.gz
          curl -L -o trantor-1.5.26.tar.gz \
            https://github.com/an-tao/trantor/archive/refs/tags/v1.5.26.tar.gz
          tar xf trantor-1.5.26.tar.gz
          rmdir drogon-1.9.12/trantor
          mv trantor-1.5.26 drogon-1.9.12/trantor
          cd drogon-1.9.12
          mkdir build && cd build
          cmake_args=(
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/drogon"
            -DBUILD_SHARED_LIBS=OFF
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            -DBUILD_CTL=OFF
            -DBUILD_EXAMPLES=OFF
            -DBUILD_ORM=OFF
            -DBUILD_BROTLI=OFF
            -DBUILD_YAML_CONFIG=OFF
            -DBUILD_DOC=OFF
          )
          if [ "$(uname)" = "Darwin" ]; then
            cmake_args+=("-DOPENSSL_ROOT_DIR=${HOMEBREW_PREFIX}/opt/openssl@3")
          fi
          cmake .. "${cmake_args[@]}"
          make -j"${NPROC}"
          make install

      # ---- Build ikafssn ----

      - name: Build ikafssn
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda'
        run: |
          cmake_args=(
            -DCMAKE_BUILD_TYPE=Release
            -DNCBI_TOOLKIT_BUILD_TAG="${{ steps.ncbi.outputs.build_tag }}"
          )
          cmake -S . -B build "${cmake_args[@]}"
          cmake --build build -j"${NPROC}"

      # ---- Package DEB (Linux only) ----

      - name: Package DEB
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'deb'
        run: |
          cd build
          cpack -G DEB
          version=$(grep 'set(IKAFSSN_VERSION' ../CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          arch=$(dpkg --print-architecture)
          for f in *.deb; do
            newname="ikafssn_${version}_ubuntu-${{ matrix.ubuntu_ver }}_${arch}.deb"
            mv "$f" "$newname"
          done

      # ---- Package Bottle (macOS only) ----

      - name: Package Bottle
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'bottle'
        run: |
          version=$(grep 'set(IKAFSSN_VERSION' CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          bottle_dir="ikafssn/${version}"
          mkdir -p "${bottle_dir}/bin"
          mkdir -p "${bottle_dir}/share/ikafssn/systemd"

          bins=(ikafssnindex ikafssnsearch ikafssnserver ikafssnclient ikafssnretrieve ikafssninfo ikafssnhttpd)
          for b in "${bins[@]}"; do
            cp "build/src/${b}" "${bottle_dir}/bin/"
            strip "${bottle_dir}/bin/${b}" 2>/dev/null || true
          done

          cp doc/systemd/ikafssnserver@.service doc/systemd/ikafssnhttpd@.service \
             doc/systemd/README.md "${bottle_dir}/share/ikafssn/systemd/"

          bottle_file="ikafssn-${version}.${{ matrix.bottle_tag }}.bottle.tar.gz"
          tar czf "${bottle_file}" ikafssn/

          sha256=$(shasum -a 256 "${bottle_file}" | awk '{print $1}')
          echo "::notice::Bottle SHA256: ${sha256}"

      # ---- Package RPM (EL only) ----

      - name: Package RPM
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'rpm'
        run: |
          cd build
          cpack -G RPM
          version=$(grep 'set(IKAFSSN_VERSION' ../CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          arch=$(uname -m)
          for f in *.rpm; do
            newname="ikafssn-${version}.el${{ matrix.el_ver }}.${arch}.rpm"
            mv "$f" "$newname"
          done

      # ---- Package Conda (linux-64 / linux-aarch64 / osx-arm64) ----

      - name: Setup Miniforge (Conda)
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'conda'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"

      - name: Install conda-build (Conda)
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'conda'
        shell: bash -el {0}
        run: |
          mamba install -y conda-build

      - name: Build .conda package
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'conda'
        shell: bash -el {0}
        run: |
          mkdir -p conda-out
          conda build \
            --no-anaconda-upload \
            --output-folder ./conda-out \
            -c conda-forge \
            recipe/

      - name: Rename .conda package
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'conda'
        run: |
          mkdir -p conda-dist
          src=$(find conda-out/${{ matrix.conda_subdir }} -maxdepth 1 -name '*.conda' | head -n 1)
          if [ -z "${src}" ]; then
            echo "::error::No .conda artifact found in conda-out/${{ matrix.conda_subdir }}"
            exit 1
          fi
          newname="ikafssn_${IKAFSSN_VERSION}_${{ matrix.conda_subdir }}.conda"
          cp "${src}" "conda-dist/${newname}"
          echo "::notice::Built ${newname}"

      # ---- Upload ----

      - name: Upload artifact
        if: steps.check_asset.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            build/*.deb
            build/*.rpm
            *.bottle.tar.gz
            conda-dist/*.conda

      - name: Upload release asset
        if: steps.check_asset.outputs.exists != 'true'
        run: |
          version="${IKAFSSN_VERSION}"
          tag="v${version}"
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::notice::Release ${tag} not found — skipping asset upload"
            exit 0
          fi
          shopt -s nullglob
          files=(build/*.deb build/*.rpm *.bottle.tar.gz conda-dist/*.conda)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::No package files to upload"
            exit 0
          fi
          gh release upload "${tag}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-conda-channel:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Read version
        id: version
        run: |
          # Use the workflow_dispatch input rather than reading CMakeLists.txt
          # so the channel always reflects the version that was just released.
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Verify release has all three .conda assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          missing=()
          for subdir in linux-64 linux-aarch64 osx-arm64; do
            asset="ikafssn_${{ steps.version.outputs.version }}_${subdir}.conda"
            if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
                  --json assets --jq '.assets[].name' | grep -Fxq "${asset}"; then
              missing+=("${asset}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing release assets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Checkout conda-ikafssn
        uses: actions/checkout@v6
        with:
          repository: astanabe/conda-ikafssn
          token: ${{ secrets.CONDA_IKAFSSN_TOKEN }}
          path: conda-ikafssn

      - name: Download .conda artifacts and regenerate repodata.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IKAFSSN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${IKAFSSN_VERSION}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/"
          mkdir -p downloads
          for subdir in linux-64 linux-aarch64 osx-arm64; do
            asset="ikafssn_${IKAFSSN_VERSION}_${subdir}.conda"
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "${asset}" --dir downloads
          done

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          import tempfile
          import zipfile
          from pathlib import Path

          version = os.environ["IKAFSSN_VERSION"]
          base_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/"
              f"download/v{version}/"
          )

          for subdir in ("linux-64", "linux-aarch64", "osx-arm64"):
              fn = f"ikafssn_{version}_{subdir}.conda"
              path = Path("downloads") / fn

              data = path.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              md5 = hashlib.md5(data).hexdigest()
              size = len(data)

              # .conda is a zip containing info-*.tar.zst
              with zipfile.ZipFile(path) as z:
                  info_member = next(
                      n for n in z.namelist() if n.startswith("info-")
                          and n.endswith(".tar.zst")
                  )
                  z.extract(info_member, "extract")

              with tempfile.TemporaryDirectory() as td:
                  # zstandard is shipped with conda-build images; use cli.
                  os.system(
                      f"tar x --zstd -C {td} -f extract/{info_member}"
                  )
                  with open(Path(td) / "info" / "index.json") as f:
                      idx = json.load(f)

              repodata = {
                  "info": {
                      "subdir": subdir,
                      "base_url": base_url,
                  },
                  "repodata_version": 2,
                  "packages": {},
                  "packages.conda": {
                      fn: {
                          "name": idx["name"],
                          "version": idx["version"],
                          "build": idx["build"],
                          "build_number": idx["build_number"],
                          "subdir": subdir,
                          "depends": idx.get("depends", []),
                          "md5": md5,
                          "sha256": sha256,
                          "size": size,
                          "timestamp": idx.get("timestamp", 0),
                      },
                  },
                  "removed": [],
              }

              out = Path("conda-ikafssn") / subdir / "repodata.json"
              out.write_text(json.dumps(repodata, indent=2) + "\n")
              print(f"wrote {out}")
          PY

      - name: Commit and push channel index
        run: |
          cd conda-ikafssn
          git config user.name "ikafssn-release-bot"
          git config user.email "noreply@ikafssn.org"
          if git diff --quiet -- '*/repodata.json'; then
            echo "::notice::repodata.json unchanged; nothing to commit."
            exit 0
          fi
          git add */repodata.json
          git commit -m "Update channel index for ikafssn v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
