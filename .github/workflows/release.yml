name: Release

run-name: "ikafssn v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 0.1.2026.03.18)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu-24.04
            os: ubuntu-24.04
            ubuntu_ver: "24.04"
            pkg_type: deb
          - target: aarch64-linux-gnu-24.04
            os: ubuntu-24.04-arm
            ubuntu_ver: "24.04"
            pkg_type: deb
          - target: x86_64-linux-gnu-26.04
            os: ubuntu-26.04
            ubuntu_ver: "26.04"
            pkg_type: deb
          - target: aarch64-linux-gnu-26.04
            os: ubuntu-26.04-arm
            ubuntu_ver: "26.04"
            pkg_type: deb
          - target: aarch64-apple-darwin-tahoe
            os: macos-26
            ubuntu_ver: ""
            pkg_type: bottle
            bottle_tag: arm64_tahoe
          - target: x86_64-linux-el9
            os: ubuntu-24.04
            container: almalinux:9
            ubuntu_ver: ""
            pkg_type: rpm
            el_ver: "9"
          - target: x86_64-linux-el10
            os: ubuntu-24.04
            container: almalinux:10
            ubuntu_ver: ""
            pkg_type: rpm
            el_ver: "10"
          - target: aarch64-linux-el9
            os: ubuntu-24.04-arm
            container: almalinux:9
            ubuntu_ver: ""
            pkg_type: rpm
            el_ver: "9"
          - target: aarch64-linux-el10
            os: ubuntu-24.04-arm
            container: almalinux:10
            ubuntu_ver: ""
            pkg_type: rpm
            el_ver: "10"
          - target: x86_64-linux-conda
            os: ubuntu-24.04
            ubuntu_ver: ""
            pkg_type: conda
            conda_subdir: linux-64
          - target: aarch64-linux-conda
            os: ubuntu-24.04-arm
            ubuntu_ver: ""
            pkg_type: conda
            conda_subdir: linux-aarch64
          - target: aarch64-apple-darwin-conda
            os: macos-26
            ubuntu_ver: ""
            pkg_type: conda
            conda_subdir: osx-arm64

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}

    steps:
      - name: Install git (container)
        if: matrix.container
        run: dnf install -y git

      - uses: actions/checkout@v6

      # ---- System dependencies ----

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux' && matrix.ubuntu_ver != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake dpkg-dev pkg-config \
            libtbb-dev liblmdb-dev libsqlite3-dev libzstd-dev \
            libcurl4-openssl-dev libjsoncpp-dev \
            zlib1g-dev libbz2-dev liblzma-dev libdeflate-dev autoconf \
            libssl-dev uuid-dev

      - name: Untap untrusted prebuilt taps (macOS)
        if: runner.os == 'macOS'
        run: |
          # GitHub's macOS runner ships aws/tap and azure/bicep, which Homebrew's
          # tap-trust policy flags as untrusted.  We don't use them; untap so brew
          # stops warning and stays forward-compatible with Homebrew 5.2/6.0.
          # --force is required for azure/bicep because its bicep formula is
          # installed, and plain untap refuses to remove a tap with installed
          # formulae.
          for t in aws/tap azure/bicep; do
            brew untap --force "$t" 2>/dev/null || true
          done

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS' && matrix.pkg_type != 'conda'
        run: |
          pkgs=(tbb lmdb sqlite3 curl jsoncpp xz libdeflate zstd pkg-config autoconf automake libtool openssl@3)
          to_install=()
          for p in "${pkgs[@]}"; do
            brew list --formula "$p" >/dev/null 2>&1 || to_install+=("$p")
          done
          if [ ${#to_install[@]} -gt 0 ]; then
            brew install "${to_install[@]}"
          else
            echo "All required formulae already installed."
          fi

      - name: Install system dependencies (EL)
        if: matrix.pkg_type == 'rpm'
        run: |
          dnf install -y epel-release
          dnf install -y 'dnf-command(config-manager)' || true
          dnf config-manager --set-enabled crb || true
          dnf install -y \
            gcc-c++ cmake rpm-build make pkgconfig \
            tbb-devel lmdb-devel sqlite-devel libzstd-devel \
            libcurl-devel jsoncpp-devel \
            zlib-devel bzip2-devel xz-devel libdeflate-devel \
            openssl-devel libuuid-devel \
            autoconf automake libtool \
            tar gzip bzip2 zstd patch diffutils findutils which
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh

      # EL 9's system GCC is 11; the NCBI C++ Toolkit requires GCC 13 or newer.
      # libstdc++-devel carries the linker script for -lstdc++; without it a
      # program that includes <iostream> compiles but fails to link, which the
      # toolkit reports as "Neither <iostream> nor <iostream.h> can be found".
      - name: Install GCC 13 toolset (EL 9)
        if: matrix.el_ver == '9'
        run: |
          dnf install -y \
            gcc-toolset-13-gcc gcc-toolset-13-gcc-c++ \
            gcc-toolset-13-libstdc++-devel gcc-toolset-13-binutils \
            gcc-toolset-13-runtime

      # ---- Environment ----

      - name: Set environment
        run: |
          echo "NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          version=$(grep 'set(IKAFSSN_VERSION' CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          input_version="${{ inputs.version }}"
          if [ "${version}" != "${input_version}" ]; then
            echo "::error::Version mismatch: CMakeLists.txt has '${version}' but workflow input is '${input_version}'. Bump IKAFSSN_VERSION in CMakeLists.txt to match the release tag, or re-dispatch from a commit that contains the bump."
            exit 1
          fi
          echo "IKAFSSN_VERSION=${version}" >> "$GITHUB_ENV"

      # ---- Skip if the asset for this target already exists in the release ----

      - name: Compute expected release asset filename
        id: expected
        shell: bash
        run: |
          case "${{ matrix.pkg_type }}" in
            deb)
              case "${{ runner.arch }}" in
                X64)   arch="amd64" ;;
                ARM64) arch="arm64" ;;
                *)     arch="${{ runner.arch }}" ;;
              esac
              filename="ikafssn_${IKAFSSN_VERSION}_ubuntu-${{ matrix.ubuntu_ver }}_${arch}.deb"
              ;;
            rpm)
              case "${{ runner.arch }}" in
                X64)   arch="x86_64" ;;
                ARM64) arch="aarch64" ;;
                *)     arch="${{ runner.arch }}" ;;
              esac
              filename="ikafssn-${IKAFSSN_VERSION}.el${{ matrix.el_ver }}.${arch}.rpm"
              ;;
            bottle)
              filename="ikafssn-${IKAFSSN_VERSION}.${{ matrix.bottle_tag }}.bottle.tar.gz"
              ;;
            conda)
              filename="ikafssn_${IKAFSSN_VERSION}_${{ matrix.conda_subdir }}.conda"
              ;;
            *)
              echo "::error::unknown pkg_type ${{ matrix.pkg_type }}"
              exit 1
              ;;
          esac
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"
          echo "::notice::Expected release asset: ${filename}"

      - name: Check if release asset already exists
        id: check_asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${IKAFSSN_VERSION}"
          expected="${{ steps.expected.outputs.filename }}"
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${tag} does not exist yet; will build."
            exit 0
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
                --json assets --jq '.assets[].name' \
              | grep -Fxq "${expected}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Asset ${expected} already attached to ${tag}; skipping build. Delete it from the release to force a rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Asset ${expected} not yet attached to ${tag}; will build."
          fi

      # Source the toolset's own enable script rather than naming the binaries
      # by path: it also exports the LD_LIBRARY_PATH the toolset's linker and
      # runtime need, without which linking anything that pulls in libstdc++
      # fails.  The trailing check fails the job here instead of leaving a
      # misleading "header not found" further down the toolkit build.
      - name: Use GCC 13 (EL 9)
        if: steps.check_asset.outputs.exists != 'true' && matrix.el_ver == '9'
        run: |
          . /opt/rh/gcc-toolset-13/enable
          echo "CC=$(command -v gcc)" >> "$GITHUB_ENV"
          echo "CXX=$(command -v g++)" >> "$GITHUB_ENV"
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi
          echo "/opt/rh/gcc-toolset-13/root/usr/bin" >> "$GITHUB_PATH"

          # gcc-toolset splits libstdc++ into the system libstdc++.so.6 plus
          # libstdc++_nonshared.a for the newer symbols, and the archive calls
          # back into the shared library.  Under --as-needed the linker drops
          # libstdc++.so.6 before it reaches those references and the link dies
          # on std::ios_base::Init.  The NCBI toolchain puts --as-needed in
          # CMAKE_EXE_LINKER_FLAGS_INIT, to which CMake appends $LDFLAGS, so
          # naming --no-as-needed here is what ends up last and wins.
          LDFLAGS="-Wl,--no-as-needed"
          export LDFLAGS
          echo "LDFLAGS=${LDFLAGS}" >> "$GITHUB_ENV"

          g++ --version

          # The toolkit derives HAVE_IOSTREAM from check_include_file_cxx, which
          # compiles *and links* the probe.  Run the same check standalone so a
          # failure names the compiler invocation here instead of surfacing as
          # "Neither <iostream> nor <iostream.h> can be found" mid-build.
          mkdir -p /tmp/iock
          {
            echo 'cmake_minimum_required(VERSION 3.20)'
            echo 'project(iock CXX)'
            echo 'include(CheckIncludeFileCXX)'
            echo 'check_include_file_cxx(iostream HAVE_IOSTREAM)'
            echo 'if(NOT HAVE_IOSTREAM)'
            echo '  message(FATAL_ERROR "check_include_file_cxx(iostream) failed")'
            echo 'endif()'
          } > /tmp/iock/CMakeLists.txt
          # Same flags the toolkit's generated toolchain applies.
          if ! cmake -S /tmp/iock -B /tmp/iock/build \
                 -DCMAKE_CXX_FLAGS="-gdwarf-4 -Wall -Wno-format-y2k -std=c++20" \
                 -DCMAKE_EXE_LINKER_FLAGS="-Wl,--enable-new-dtags -Wl,--as-needed ${LDFLAGS}" \
                 > /tmp/iock/out.txt 2>&1; then
            cat /tmp/iock/out.txt
            echo '----- CMakeConfigureLog.yaml -----'
            cat /tmp/iock/build/CMakeFiles/CMakeConfigureLog.yaml 2>/dev/null || true
            echo '----- CMakeError.log -----'
            cat /tmp/iock/build/CMakeFiles/CMakeError.log 2>/dev/null || true
            exit 1
          fi
          echo "::notice::check_include_file_cxx(iostream) succeeds under gcc-toolset-13"

      - name: Set Homebrew paths (macOS)
        if: steps.check_asset.outputs.exists != 'true' && runner.os == 'macOS' && matrix.pkg_type != 'conda'
        run: |
          HB=$(brew --prefix)
          echo "HOMEBREW_PREFIX=${HB}" >> "$GITHUB_ENV"
          {
            echo "CMAKE_PREFIX_PATH=${HB}:${HB}/opt/openssl@3:${HB}/opt/sqlite3:${HB}/opt/curl"
            # ${HB}/lib/pkgconfig carries the non-keg-only formulae (zstd
            # among them); pkg-config does not search it by default, so name
            # it here rather than relying on CMAKE_PREFIX_PATH propagation.
            echo "PKG_CONFIG_PATH=${HB}/lib/pkgconfig:${HB}/opt/openssl@3/lib/pkgconfig:${HB}/opt/sqlite3/lib/pkgconfig:${HB}/opt/curl/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      # ---- Cache source-built dependencies ----

      - name: Cache source-built dependencies
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda'
        uses: actions/cache@v5
        id: deps-cache
        with:
          path: |
            parasail
            htslib
            ncbi-cxx-toolkit
            drogon
          key: deps-${{ matrix.target }}-ncbi30.7.0-parasail2.6.2+degmatch-htslib1.24-drogon1.9.13+trantor1.5.28-v1

      # ---- Build Parasail ----

      - name: Build Parasail
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda' && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --retry-max-time 300 -fL -o parasail-2.6.2.tar.gz \
            https://github.com/jeffdaily/parasail/archive/refs/tags/v2.6.2.tar.gz
          tar xf parasail-2.6.2.tar.gz
          cd parasail-2.6.2
          patch -p1 < "${GITHUB_WORKSPACE}/patches/parasail-degmatch-cigar-score.patch"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/parasail" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          make -j"${NPROC}" parasail
          mkdir -p "${GITHUB_WORKSPACE}/parasail"/{lib,include}
          cp libparasail.a "${GITHUB_WORKSPACE}/parasail/lib/"
          cp -r ../parasail.h ../parasail "${GITHUB_WORKSPACE}/parasail/include/"

      # ---- Build htslib ----

      - name: Build htslib
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda' && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --retry-max-time 300 -fL -o htslib-1.24.tar.bz2 \
            https://github.com/samtools/htslib/releases/download/1.24/htslib-1.24.tar.bz2
          tar xf htslib-1.24.tar.bz2
          cd htslib-1.24
          autoreconf -i
          configure_args=(--prefix="${GITHUB_WORKSPACE}/htslib"
            --disable-libcurl --disable-gcs --disable-s3)
          if [ "$(uname)" = "Darwin" ]; then
            configure_args+=(
              CPPFLAGS="-I${HOMEBREW_PREFIX}/include"
              LDFLAGS="-L${HOMEBREW_PREFIX}/lib")
          fi
          ./configure "${configure_args[@]}"
          make -j"${NPROC}"
          make install

      # ---- Build NCBI C++ Toolkit ----

      - name: Build NCBI C++ Toolkit
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda' && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --retry-max-time 300 -fL -o ncbi-cxx-toolkit-public-release-30.7.0.tar.gz \
            https://github.com/ncbi/ncbi-cxx-toolkit-public/archive/refs/tags/release/30.7.0.tar.gz
          tar xf ncbi-cxx-toolkit-public-release-30.7.0.tar.gz
          cd ncbi-cxx-toolkit-public-release-30.7.0
          if [ "$(uname)" = "Darwin" ]; then
            export CFLAGS="-I${HOMEBREW_PREFIX}/include"
            export CXXFLAGS="-I${HOMEBREW_PREFIX}/include -std=c++20"
          else
            export CXXFLAGS="-std=c++20"
          fi
          ./cmake-configure \
            --without-debug \
            --with-projects="objtools/blast/seqdb_reader;objtools/blast/blastdb_format" \
            --with-install="${GITHUB_WORKSPACE}/ncbi-cxx-toolkit"
          cd CMake-*/build
          make -j"${NPROC}"
          make install

      # ---- Detect NCBI build tag ----

      - name: Detect NCBI build tag
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda'
        id: ncbi
        run: |
          build_tag=$(basename ncbi-cxx-toolkit/CMake-*/)
          echo "build_tag=${build_tag}" >> "$GITHUB_OUTPUT"

      # ---- Build Drogon (static, with trantor submodule fetched separately) ----

      - name: Build Drogon
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda' && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --retry-max-time 300 -fL -o drogon-1.9.13.tar.gz \
            https://github.com/drogonframework/drogon/archive/refs/tags/v1.9.13.tar.gz
          tar xf drogon-1.9.13.tar.gz
          curl --retry 8 --retry-delay 5 --retry-all-errors --retry-max-time 300 -fL -o trantor-1.5.28.tar.gz \
            https://github.com/an-tao/trantor/archive/refs/tags/v1.5.28.tar.gz
          tar xf trantor-1.5.28.tar.gz
          rmdir drogon-1.9.13/trantor
          mv trantor-1.5.28 drogon-1.9.13/trantor
          cd drogon-1.9.13
          mkdir build && cd build
          cmake_args=(
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/drogon"
            -DBUILD_SHARED_LIBS=OFF
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            -DBUILD_CTL=OFF
            -DBUILD_EXAMPLES=OFF
            -DBUILD_ORM=OFF
            -DBUILD_BROTLI=OFF
            -DBUILD_YAML_CONFIG=OFF
            -DBUILD_DOC=OFF
          )
          if [ "$(uname)" = "Darwin" ]; then
            cmake_args+=("-DOPENSSL_ROOT_DIR=${HOMEBREW_PREFIX}/opt/openssl@3")
          fi
          cmake .. "${cmake_args[@]}"
          make -j"${NPROC}"
          make install

      # ---- Build ikafssn ----

      - name: Build ikafssn
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type != 'conda'
        run: |
          cmake_args=(
            -DCMAKE_BUILD_TYPE=Release
            -DNCBI_TOOLKIT_BUILD_TAG="${{ steps.ncbi.outputs.build_tag }}"
          )
          cmake -S . -B build "${cmake_args[@]}"
          cmake --build build -j"${NPROC}"

      # ---- Package DEB (Linux only) ----

      - name: Package DEB
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'deb'
        run: |
          cd build
          cpack -G DEB
          version=$(grep 'set(IKAFSSN_VERSION' ../CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          arch=$(dpkg --print-architecture)
          for f in *.deb; do
            newname="ikafssn_${version}_ubuntu-${{ matrix.ubuntu_ver }}_${arch}.deb"
            mv "$f" "$newname"
          done

      # ---- Package Bottle (macOS only) ----

      - name: Package Bottle
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'bottle'
        run: |
          version=$(grep 'set(IKAFSSN_VERSION' CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          bottle_dir="ikafssn/${version}"
          mkdir -p "${bottle_dir}/bin"
          mkdir -p "${bottle_dir}/share/ikafssn/systemd"

          bins=(ikafssnindex ikafssnsearch ikafssnserver ikafssnclient ikafssnretrieve ikafssninfo ikafssnhttpd)
          for b in "${bins[@]}"; do
            cp "build/src/${b}" "${bottle_dir}/bin/"
            strip "${bottle_dir}/bin/${b}" 2>/dev/null || true
          done

          cp doc/systemd/ikafssnserver@.service doc/systemd/ikafssnhttpd@.service \
             doc/systemd/README.md "${bottle_dir}/share/ikafssn/systemd/"

          bottle_file="ikafssn-${version}.${{ matrix.bottle_tag }}.bottle.tar.gz"
          tar czf "${bottle_file}" ikafssn/

          sha256=$(shasum -a 256 "${bottle_file}" | awk '{print $1}')
          echo "::notice::Bottle SHA256: ${sha256}"

      # ---- Package RPM (EL only) ----

      - name: Package RPM
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'rpm'
        run: |
          cd build
          cpack -G RPM
          version=$(grep 'set(IKAFSSN_VERSION' ../CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          arch=$(uname -m)
          for f in *.rpm; do
            newname="ikafssn-${version}.el${{ matrix.el_ver }}.${arch}.rpm"
            mv "$f" "$newname"
          done

      # ---- Package Conda (linux-64 / linux-aarch64 / osx-arm64) ----

      - name: Setup Miniforge (Conda)
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'conda'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"

      - name: Install conda-build (Conda)
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'conda'
        shell: bash -el {0}
        run: |
          # Install conda-build into the base env: setup-miniconda activates a
          # separate "test" env via `bash -el {0}`, but `conda` itself lives in
          # base, so its plugin discovery only finds subcommands installed
          # there. With conda 26.3.x the entry-point lookup tightened, and a
          # conda-build that lives in `test` no longer registers `conda build`,
          # producing `argument COMMAND: invalid choice: 'build'` (cf. the
          # 2026.05.04 release run on conda 26.3.2).
          mamba install -n base -y conda-build

      - name: Build .conda package
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'conda'
        shell: bash -el {0}
        run: |
          mkdir -p conda-out
          # Run via `conda run -n base` so PATH is set to base's bin and the
          # `conda build` plugin (installed above) is on the resolution path,
          # regardless of which env `bash -el {0}` happened to activate.
          conda run -n base conda build \
            --no-anaconda-upload \
            --output-folder ./conda-out \
            -c conda-forge \
            recipe/

      - name: Rename .conda package
        if: steps.check_asset.outputs.exists != 'true' && matrix.pkg_type == 'conda'
        run: |
          mkdir -p conda-dist
          src=$(find conda-out/${{ matrix.conda_subdir }} -maxdepth 1 -name '*.conda' | head -n 1)
          if [ -z "${src}" ]; then
            echo "::error::No .conda artifact found in conda-out/${{ matrix.conda_subdir }}"
            exit 1
          fi
          newname="ikafssn_${IKAFSSN_VERSION}_${{ matrix.conda_subdir }}.conda"
          cp "${src}" "conda-dist/${newname}"
          echo "::notice::Built ${newname}"

      # ---- Upload ----

      - name: Upload artifact
        if: steps.check_asset.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            build/*.deb
            build/*.rpm
            *.bottle.tar.gz
            conda-dist/*.conda

      - name: Upload release asset
        if: steps.check_asset.outputs.exists != 'true'
        run: |
          version="${IKAFSSN_VERSION}"
          tag="v${version}"
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::notice::Release ${tag} not found — skipping asset upload"
            exit 0
          fi
          shopt -s nullglob
          files=(build/*.deb build/*.rpm *.bottle.tar.gz conda-dist/*.conda)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::No package files to upload"
            exit 0
          fi
          gh release upload "${tag}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-conda-channel:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Read version
        id: version
        run: |
          # Use the workflow_dispatch input rather than reading CMakeLists.txt
          # so the channel always reflects the version that was just released.
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Verify release has all three .conda assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          missing=()
          for subdir in linux-64 linux-aarch64 osx-arm64; do
            asset="ikafssn_${{ steps.version.outputs.version }}_${subdir}.conda"
            if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
                  --json assets --jq '.assets[].name' | grep -Fxq "${asset}"; then
              missing+=("${asset}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing release assets: %s\n' "${missing[*]}"
            echo "::error::If the build matrix all succeeded, the build job likely skipped because CMakeLists.txt's IKAFSSN_VERSION did not match inputs.version (=${{ steps.version.outputs.version }}). Verify both agree and re-dispatch."
            exit 1
          fi

      - name: Checkout conda-ikafssn
        uses: actions/checkout@v6
        with:
          repository: astanabe/conda-ikafssn
          token: ${{ secrets.CONDA_IKAFSSN_TOKEN }}
          path: conda-ikafssn

      - name: Download .conda artifacts and regenerate repodata.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IKAFSSN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${IKAFSSN_VERSION}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/"
          mkdir -p downloads
          for subdir in linux-64 linux-aarch64 osx-arm64; do
            asset="ikafssn_${IKAFSSN_VERSION}_${subdir}.conda"
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "${asset}" --dir downloads
          done

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          import tempfile
          import zipfile
          from pathlib import Path

          version = os.environ["IKAFSSN_VERSION"]
          base_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/"
              f"download/v{version}/"
          )

          for subdir in ("linux-64", "linux-aarch64", "osx-arm64"):
              fn = f"ikafssn_{version}_{subdir}.conda"
              path = Path("downloads") / fn

              data = path.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              md5 = hashlib.md5(data).hexdigest()
              size = len(data)

              # .conda is a zip containing info-*.tar.zst
              with zipfile.ZipFile(path) as z:
                  info_member = next(
                      n for n in z.namelist() if n.startswith("info-")
                          and n.endswith(".tar.zst")
                  )
                  z.extract(info_member, "extract")

              with tempfile.TemporaryDirectory() as td:
                  # zstandard is shipped with conda-build images; use cli.
                  os.system(
                      f"tar x --zstd -C {td} -f extract/{info_member}"
                  )
                  with open(Path(td) / "info" / "index.json") as f:
                      idx = json.load(f)

              repodata = {
                  "info": {
                      "subdir": subdir,
                      "base_url": base_url,
                  },
                  "repodata_version": 2,
                  "packages": {},
                  "packages.conda": {
                      fn: {
                          "name": idx["name"],
                          "version": idx["version"],
                          "build": idx["build"],
                          "build_number": idx["build_number"],
                          "subdir": subdir,
                          "depends": idx.get("depends", []),
                          "md5": md5,
                          "sha256": sha256,
                          "size": size,
                          "timestamp": idx.get("timestamp", 0),
                      },
                  },
                  "removed": [],
              }

              out = Path("conda-ikafssn") / subdir / "repodata.json"
              out.write_text(json.dumps(repodata, indent=2) + "\n")
              print(f"wrote {out}")
          PY

      - name: Commit and push channel index
        run: |
          cd conda-ikafssn
          git config user.name "ikafssn-release-bot"
          git config user.email "noreply@ikafssn.org"
          if git diff --quiet -- '*/repodata.json'; then
            echo "::notice::repodata.json unchanged; nothing to commit."
            exit 0
          fi
          git add */repodata.json
          git commit -m "Update channel index for ikafssn v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

  update-homebrew-tap:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Read version
        id: version
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Verify bottle and source tarball exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          bottle="ikafssn-${{ steps.version.outputs.version }}.arm64_tahoe.bottle.tar.gz"
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
                --json assets --jq '.assets[].name' | grep -Fxq "${bottle}"; then
            echo "::error::Missing bottle asset: ${bottle}"
            echo "::error::If the build matrix all succeeded, the build job likely skipped because CMakeLists.txt's IKAFSSN_VERSION did not match inputs.version (=${{ steps.version.outputs.version }}). Verify both agree and re-dispatch."
            exit 1
          fi

      - name: Checkout homebrew-ikafssn
        uses: actions/checkout@v6
        with:
          repository: astanabe/homebrew-ikafssn
          token: ${{ secrets.HOMEBREW_IKAFSSN_TOKEN }}
          path: homebrew-ikafssn

      - name: Compute hashes and update formula
        env:
          IKAFSSN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${IKAFSSN_VERSION}"
          src_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          bottle_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/ikafssn-${IKAFSSN_VERSION}.arm64_tahoe.bottle.tar.gz"

          # GitHub auto-generated tag tarballs are deterministic per tag.
          src_sha=$(curl -sL "${src_url}" | sha256sum | awk '{print $1}')
          bottle_sha=$(curl -sL "${bottle_url}" | sha256sum | awk '{print $1}')
          echo "::notice::source sha256: ${src_sha}"
          echo "::notice::bottle sha256: ${bottle_sha}"

          export IKAFSSN_VERSION SRC_SHA="${src_sha}" BOTTLE_SHA="${bottle_sha}"
          export FORMULA="homebrew-ikafssn/Formula/ikafssn.rb"

          python3 - <<'PY'
          import os
          import re

          version = os.environ["IKAFSSN_VERSION"]
          src_sha = os.environ["SRC_SHA"]
          bottle_sha = os.environ["BOTTLE_SHA"]
          formula_path = os.environ["FORMULA"]

          with open(formula_path) as f:
              content = f.read()

          # 1. url ".../v<old>.tar.gz" -> v<new>
          content = re.sub(
              r'url "https://github\.com/astanabe/ikafssn/archive/refs/tags/v[\d.]+\.tar\.gz"',
              f'url "https://github.com/astanabe/ikafssn/archive/refs/tags/v{version}.tar.gz"',
              content,
              count=1,
          )

          # 2. The top-level source sha256 — the sha256 line immediately
          #    following the url line. Match url+newline+indent+sha256, replace
          #    the sha256 portion only.
          content = re.sub(
              r'(url "[^"]+"\n\s*)sha256 "[0-9a-f]{64}"',
              lambda m: m.group(1) + f'sha256 "{src_sha}"',
              content,
              count=1,
          )

          # 3. bottle root_url
          content = re.sub(
              r'root_url "https://github\.com/astanabe/ikafssn/releases/download/v[\d.]+"',
              f'root_url "https://github.com/astanabe/ikafssn/releases/download/v{version}"',
              content,
              count=1,
          )

          # 4. bottle sha256 for arm64_tahoe
          content = re.sub(
              r'sha256 cellar: :any, arm64_tahoe: "[0-9a-f]{64}"',
              f'sha256 cellar: :any, arm64_tahoe: "{bottle_sha}"',
              content,
              count=1,
          )

          with open(formula_path, "w") as f:
              f.write(content)
          print(f"updated {formula_path}")
          PY

      - name: Commit and push formula
        run: |
          cd homebrew-ikafssn
          git config user.name "ikafssn-release-bot"
          git config user.email "noreply@ikafssn.org"
          if git diff --quiet -- Formula/ikafssn.rb; then
            echo "::notice::Formula unchanged; nothing to commit."
            exit 0
          fi
          git add Formula/ikafssn.rb
          git commit -m "Update formula for ikafssn v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

  update-deb-channel:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: version
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Verify release has all four .deb assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          missing=()
          for ubuntu_ver in 24.04 26.04; do
            for arch in amd64 arm64; do
              asset="ikafssn_${{ steps.version.outputs.version }}_ubuntu-${ubuntu_ver}_${arch}.deb"
              if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
                    --json assets --jq '.assets[].name' | grep -Fxq "${asset}"; then
                missing+=("${asset}")
              fi
            done
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing release assets: %s\n' "${missing[*]}"
            echo "::error::If the build matrix all succeeded, the build job likely skipped because CMakeLists.txt's IKAFSSN_VERSION did not match inputs.version (=${{ steps.version.outputs.version }}). Verify both agree and re-dispatch."
            exit 1
          fi

      - name: Install APT tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.IKAFSSN_GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Checkout deb-ikafssn
        uses: actions/checkout@v6
        with:
          repository: astanabe/deb-ikafssn
          token: ${{ secrets.DEB_IKAFSSN_TOKEN }}
          path: deb-ikafssn

      - name: Regenerate APT channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IKAFSSN_VERSION: ${{ steps.version.outputs.version }}
          IKAFSSN_GPG_KEYID: ${{ secrets.IKAFSSN_GPG_KEYID }}
          GPG_PASSPHRASE: ${{ secrets.IKAFSSN_GPG_PASSPHRASE }}
        run: bash recipe/deb-publish.sh deb-ikafssn

      - name: Commit and push APT channel
        run: |
          cd deb-ikafssn
          git config user.name "ikafssn-release-bot"
          git config user.email "noreply@ikafssn.org"
          git add -A pool dists
          if git diff --cached --quiet; then
            echo "::notice::APT channel unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Publish ikafssn v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

  update-rpm-channel:
    needs: build
    runs-on: ubuntu-24.04
    container: almalinux:10
    steps:
      - name: Install container tooling
        run: |
          dnf install -y \
            createrepo_c rpm-sign rpm-build gnupg2 git tar zstd \
            ca-certificates
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh

      - uses: actions/checkout@v6

      - name: Read version
        id: version
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Verify release has all four .rpm assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          missing=()
          for el_ver in 9 10; do
            for arch in x86_64 aarch64; do
              asset="ikafssn-${{ steps.version.outputs.version }}.el${el_ver}.${arch}.rpm"
              if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
                    --json assets --jq '.assets[].name' | grep -Fxq "${asset}"; then
                missing+=("${asset}")
              fi
            done
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing release assets: %s\n' "${missing[*]}"
            echo "::error::If the build matrix all succeeded, the build job likely skipped because CMakeLists.txt's IKAFSSN_VERSION did not match inputs.version (=${{ steps.version.outputs.version }}). Verify both agree and re-dispatch."
            exit 1
          fi

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.IKAFSSN_GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Checkout rpm-ikafssn
        uses: actions/checkout@v6
        with:
          repository: astanabe/rpm-ikafssn
          token: ${{ secrets.RPM_IKAFSSN_TOKEN }}
          path: rpm-ikafssn

      - name: Mark checkouts as safe
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/rpm-ikafssn"

      - name: Regenerate DNF channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IKAFSSN_VERSION: ${{ steps.version.outputs.version }}
          IKAFSSN_GPG_KEYID: ${{ secrets.IKAFSSN_GPG_KEYID }}
          GPG_PASSPHRASE: ${{ secrets.IKAFSSN_GPG_PASSPHRASE }}
        run: bash recipe/rpm-publish.sh rpm-ikafssn

      - name: Commit and push DNF channel
        run: |
          cd rpm-ikafssn
          git config user.name "ikafssn-release-bot"
          git config user.email "noreply@ikafssn.org"
          git add -A el9 el10
          if git diff --cached --quiet; then
            echo "::notice::DNF channel unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Publish ikafssn v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
